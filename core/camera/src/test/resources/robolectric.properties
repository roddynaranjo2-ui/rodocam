# SDK emulado por Robolectric para este modulo.
# targetSdk del proyecto es 36 (Baklava) pero, en Robolectric 4.16.x, android-all 16 exige Java 21
# y el proyecto compila/ejecuta tests con la toolchain de Java 17. API 35 es el ultimo nivel que
# corre con Java 17. Un test puede sobrescribirlo con @Config(sdk = [...]).
sdk=35
