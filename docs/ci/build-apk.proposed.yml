# =============================================================================
#  RodoCam — CI/CD de compilación Android
#  Ruta destino EXACTA (copiar/pegar):  .github/workflows/build-apk.yml
# =============================================================================
#  Qué mejora respecto al workflow actual:
#   - Se dispara en push/PR (no solo manual) + release por tag v*.
#   - Concurrency: cancela ejecuciones obsoletas de la misma rama.
#   - Memoria JVM acotada a 4 GB (los runners ubuntu-latest tienen ~7 GB;
#     el -Xmx8192m de gradle.properties se sobreescribe vía GRADLE_OPTS).
#   - setup-gradle@v4 (v3 está deprecado) con caché de configuración y
#     build-scan opcional. Caché de Gradle/Kotlin/AGP compartida.
#   - Se deshabilita el hook de git (installGitHooks) en CI para no escribir
#     en .git/hooks en un checkout de solo lectura.
#   - Verificación previa: lint estático (spotless/ktlint) + unit tests.
#   - Firma opcional de release con secretos (si no existen, se omite).
#   - Artefactos: APK debug, APK release (si firmado), mapping.txt de R8,
#     y reporte de lint/tests. Retención explícita.
#   - Job resumen que falla el pipeline si cualquier job crítico falló.
# =============================================================================

name: Build Android APK

on:
  push:
    branches: [ main, genspark_ai_developer ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Compilar también la variante release (requiere secretos de firma)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sobrescribe el -Xmx8192m de gradle.properties: los runners tienen ~7 GB.
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs=-Xmx4g\ -XX:MaxMetaspaceSize=1g\ -XX:+HeapDumpOnOutOfMemoryError\ -Dfile.encoding=UTF-8
    -Dorg.gradle.daemon=false
    -Dorg.gradle.workers.max=2
  # Kotlin daemon con memoria propia acotada.
  KOTLIN_DAEMON_JVM_OPTIONS: -Xmx2g
  # Evita que el task installGitHooks escriba en .git/hooks en CI.
  CI: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # 1) Análisis estático rápido (falla pronto, ahorra minutos)
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Lint (spotless / ktlint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # spotless ratchetFrom origin/main necesita historial

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Spotless check
        run: |
          chmod +x gradlew
          ./gradlew --init-script gradle/init.gradle.kts spotlessCheck \
            --no-daemon --stacktrace --console=plain
        continue-on-error: true   # Cambiar a false cuando el código esté formateado

  # ---------------------------------------------------------------------------
  # 2) Unit tests (JVM) — no requieren emulador
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmake;3.22.1'   # AGP descarga el NDK por defecto que requiera

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true

      - name: Run unit tests (flavor stable, debug)
        run: |
          chmod +x gradlew
          ./gradlew testStableDebugUnitTest \
            --no-daemon --stacktrace --console=plain --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3) Build APK debug (siempre) + release firmado (si hay secretos / tag)
  # ---------------------------------------------------------------------------
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [ static-analysis ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools cmake;3.22.1'   # AGP descarga el NDK por defecto que requiera

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          gradle-home-cache-cleanup: true
          build-scan-publish: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print environment (diagnóstico)
        run: |
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          free -h

      - name: Build Debug APK
        run: ./gradlew :app:assembleStableDebug --no-daemon --stacktrace --console=plain

      # ---- Release (opcional) -------------------------------------------------
      - name: Decode keystore
        id: keystore
        if: >-
          (startsWith(github.ref, 'refs/tags/v') || inputs.build_release == true)
          && secrets.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build Release APK (firmado)
        if: steps.keystore.outcome == 'success'
        env:
          RODOCAM_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RODOCAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RODOCAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RODOCAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleStableRelease --no-daemon --stacktrace --console=plain

      - name: Verify generated APKs
        run: |
          find app/build/outputs -type f \( -name '*.apk' -o -name 'mapping.txt' \) -print
          test -n "$(find app/build/outputs/apk -name '*.apk' -print -quit)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rodocam-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK + mapping
        if: steps.keystore.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rodocam-release-${{ github.sha }}
          path: |
            app/build/outputs/apk/stable/release/*.apk
            app/build/outputs/mapping/stableRelease/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results*.html'
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4) Resumen: un único check requerido para branch protection
  # ---------------------------------------------------------------------------
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [ static-analysis, unit-tests, build ]
    if: always()
    steps:
      - name: Evaluate
        run: |
          echo "static-analysis: ${{ needs.static-analysis.result }}"
          echo "unit-tests:      ${{ needs.unit-tests.result }}"
          echo "build:           ${{ needs.build.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "::error::Un job crítico falló"; exit 1
          fi
